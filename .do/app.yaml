# DigitalOcean App Platform spec for AI Trader.
#
# Two components built from the same Dockerfile:
#   - agent    : FastAPI service (public, health-checked) that serves the ReAct agent.
#   - telegram : worker running the aiogram bot via long-polling; it calls the agent
#                over the internal network (${agent.PRIVATE_URL}).
#
# The agent service also serves the web client (docs/WEB.md): the SPA is built into
# the image and mounted by FastAPI, so there is no static-site component and no
# ingress rules — one component answers `/`, `/api/*` and `/agent/*`.
#
# Deploy: .github/workflows/python-app.yml applies this spec after tests pass. Both
# components set `deploy_on_push: false`, so DigitalOcean's own webhook never deploys
# in parallel with CI — the copy farkle learned the hard way, where every push to main
# deployed twice and the first of the two was ungated by tests.
#
# Manual fallback:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# SECRET values below are placeholders — set the real values in the DO dashboard
# (App → Settings → component → Environment Variables) or via `doctl`. Do NOT commit
# real secrets here.
name: ai-trader
region: fra

domains:
# Depends on a CNAME that must already exist in Cloudflare before this block is
# applied:
#   trader.iamxox.space  CNAME  <app>.ondigitalocean.app  (DNS only / grey cloud)
# Order matters: DigitalOcean verifies the record before it will issue a certificate,
# so adding the domain first only parks it in verification and fires DOMAIN_FAILED.
# The record must also stay unproxied — behind Cloudflare's proxy the CA's HTTP
# validation reaches Cloudflare rather than App Platform and never completes. Leaving
# it grey also keeps Cloudflare out of the SSE path.
- domain: trader.iamxox.space
  type: PRIMARY
  # No `zone`: that field is for domains whose nameservers DigitalOcean runs, and
  # these are Cloudflare's.

services:
  - name: agent
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: artem-xox/trader
      branch: main
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: OPENAI_MODEL_STRONG
        scope: RUN_TIME
        value: gpt-4.1
      - key: OPENAI_MODEL_WEAK
        scope: RUN_TIME
        value: gpt-4.1-mini
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: AGENT_MAX_ITERATIONS
        scope: RUN_TIME
        value: "8"
      - key: LANGSMITH_TRACING
        scope: RUN_TIME
        value: "true"
      - key: LANGSMITH_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: LANGSMITH_PROJECT
        scope: RUN_TIME
        value: trader
      - key: AGENT_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD

workers:
  - name: telegram
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: artem-xox/trader
      branch: main
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: uv run python -m trader.ui.telegram.main
    envs:
      - key: TELEGRAM_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        scope: RUN_TIME
        value: ""
      - key: AGENT_APP_URL
        scope: RUN_TIME
        value: ${agent.PRIVATE_URL}
      - key: AGENT_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
