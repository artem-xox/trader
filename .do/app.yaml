# DigitalOcean App Platform spec for AI Trader.
#
# Two components built from the same Dockerfile:
#   - agent    : FastAPI service (public, health-checked) that serves the ReAct agent.
#   - telegram : worker running the aiogram bot via long-polling; it calls the agent
#                over the internal network (${agent.PRIVATE_URL}).
#
# THIS FILE IS THE APP. `.github/workflows/python-app.yml` applies it after the tests
# pass, so the app is fully described here and could be rebuilt from scratch with
# `doctl apps create --spec .do/app.yaml`. Edit the app here, not in the dashboard —
# a dashboard edit survives only until the next deploy overwrites it.
#
# ⚠️  Secret values are `${NAME}` references, resolved at deploy time from repository
# secrets of the same name. NEVER write a literal secret — or a placeholder — into
# this file. An App Platform spec is declarative: whatever stands here replaces the
# live value, and an env var missing from this file is deleted outright rather than
# left alone. On 2026-08-11 this file still carried `REPLACE_IN_DASHBOARD` placeholders
# when CI first applied it; six live secrets were replaced by that literal string —
# including AGENT_API_KEY, which this public repository then documented as a working
# credential for the live agent — and TELEGRAM_ALLOWED_CHAT_IDS was blanked, which
# crash-looped the worker.
#
# The same mechanism makes an *unset* repository secret dangerous: it expands to an
# empty string and wipes the value just as thoroughly. The deploy workflow therefore
# refuses to run until every referenced secret is present and non-empty — see its
# "Check deploy secrets" step, and add the secret there when adding one here.
#
# `${agent.PRIVATE_URL}` is not one of these: dotted names are DigitalOcean's own
# bindables and the action leaves them for the platform to resolve.
#
# The agent service also serves the web client (docs/WEB.md): the SPA is built into
# the image and mounted by FastAPI, so there is no static-site component and no
# ingress rules — one component answers `/`, `/api/*` and `/agent/*`.
#
# Both components set `deploy_on_push: false`: CI is the only deploy trigger, so a
# push cannot deploy in parallel with — and untested ahead of — the test jobs.
name: ai-trader
region: fra

domains:
# Depends on a CNAME that must already exist in Cloudflare before this block is
# applied:
#   trader.iamxox.space  CNAME  <app>.ondigitalocean.app  (DNS only / grey cloud)
# Order matters: DigitalOcean verifies the record before it will issue a certificate,
# so adding the domain first only parks it in verification and fires DOMAIN_FAILED.
# The record must also stay unproxied — behind Cloudflare's proxy the CA's HTTP
# validation reaches Cloudflare rather than App Platform and never completes. Leaving
# it grey also keeps Cloudflare out of the SSE path.
- domain: trader.iamxox.space
  type: PRIMARY
  # No `zone`: that field is for domains whose nameservers DigitalOcean runs, and
  # these are Cloudflare's.

databases:
# Conversations for the web client and the agent's per-thread memory (docs/WEB.md §5.2).
# A development database — $7/mo, 512 MiB, reachable only from this app. It is NOT backed
# up and is destroyed with the app, which is the trade accepted for a personal tool; a
# periodic pg_dump is the cheap insurance and a standalone cluster is the upgrade.
#
# ⚠️ The deploy that FIRST adds this block usually fails, with:
#   "Your deployment is waiting for trusted source networking to your database.
#    This is common while the database is still creating, forking, or not yet online."
# The database is provisioned by that same deploy, and the component is expected to
# reach it before it finishes coming up. Re-run the deploy once the database shows as
# online and it succeeds; nothing needs changing. Redeploys after that do not touch the
# database — only destroying the app does. A standalone cluster (`production: true` plus
# `cluster_name`) avoids the race entirely, because it already exists.
- name: db
  engine: PG
  version: "16"
  production: false

services:
  - name: agent
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: artem-xox/trader
      branch: main
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${OPENAI_API_KEY}
      - key: OPENAI_MODEL_STRONG
        scope: RUN_TIME
        value: gpt-4.1
      - key: OPENAI_MODEL_WEAK
        scope: RUN_TIME
        value: gpt-4.1-mini
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${TAVILY_API_KEY}
      - key: AGENT_MAX_ITERATIONS
        scope: RUN_TIME
        value: "8"
      - key: LANGSMITH_TRACING
        scope: RUN_TIME
        value: "true"
      - key: LANGSMITH_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${LANGSMITH_API_KEY}
      - key: LANGSMITH_PROJECT
        scope: RUN_TIME
        value: trader
      - key: AGENT_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${AGENT_API_KEY}
      # A DigitalOcean bindable, resolved by the platform — dotted, so the deploy action
      # leaves it alone rather than substituting a repository secret.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

workers:
  - name: telegram
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: artem-xox/trader
      branch: main
      deploy_on_push: false
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: uv run python -m trader.ui.telegram.main
    envs:
      - key: TELEGRAM_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${TELEGRAM_API_TOKEN}
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        scope: RUN_TIME
        value: ${TELEGRAM_ALLOWED_CHAT_IDS}
      - key: AGENT_APP_URL
        scope: RUN_TIME
        value: ${agent.PRIVATE_URL}
      - key: AGENT_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${AGENT_API_KEY}
