name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The store tests need a real Postgres — they exercise SQL, so a stand-in would
    # test nothing. Locally they skip themselves when DATABASE_URL is unset, which
    # keeps `make test` offline and free; here it is always set, so they always run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q tests/unit

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      # The image runs this same build; failing here keeps a broken frontend out
      # of a Docker build that takes minutes to discover the same thing.
      - run: npm run build
        working-directory: web

  deploy:
    name: Deploy to DigitalOcean
    needs: [test, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two deploys at once race for the same app. Queue rather than cancel: a
    # half-applied spec is worse than waiting.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read

    # The values behind the `${NAME}` references in .do/app.yaml. The action expands
    # them out of its own environment, so they have to be here rather than on the step.
    # Adding a secret to the spec means adding it here *and* to the list below.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}

    steps:
      - uses: actions/checkout@v4

      # The spec is declarative, so a missing repository secret does not fail the
      # substitution — it expands to an empty string, and that empty string then
      # *replaces* the live value. An unset secret is therefore indistinguishable from
      # a deliberate "wipe this", which is how prod broke on 2026-08-11 (from the other
      # direction: placeholders instead of blanks). Refuse to deploy rather than find
      # out afterwards. Names only are printed; values never are.
      - name: Check deploy secrets
        run: |
          required=(OPENAI_API_KEY TAVILY_API_KEY LANGSMITH_API_KEY AGENT_API_KEY
                    TELEGRAM_API_TOKEN TELEGRAM_ALLOWED_CHAT_IDS)
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'missing or empty repository secret: %s\n' "${missing[@]}"
            echo
            echo 'Add it under Settings → Secrets and variables → Actions, then re-run.'
            echo 'Deploying now would overwrite the live value with an empty string.'
            exit 1
          fi
          echo "all ${#required[@]} required secrets present"

      # `app_spec_location`, not `app_name`: given `app_name` the action would redeploy
      # whatever spec the app already carries and ignore this repository entirely, so
      # the domain, the components and the env vars would live only in the dashboard.
      # Pointing at the file is what makes the app reproducible from source.
      - name: Deploy app spec
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: true

      # The action reports success once DigitalOcean says the deployment is ACTIVE,
      # which is not the same as the app answering. Check the app's own live URL
      # rather than the custom domain, so this keeps working if the domain moves.
      #
      # The app JSON travels through the environment, not through `${{ }}` inside the
      # script: interpolating it directly would splice an API response into a shell
      # command.
      - name: Smoke check
        env:
          APP: ${{ steps.deploy.outputs.app }}
        run: |
          # ACTIVE precedes the edge actually serving the new build, so the
          # assertion retries rather than the request — curl's own --retry covers
          # transport errors and 5xx, never a 200 whose body is stale.
          retry() {
            local what=$1; shift
            local attempt
            for attempt in $(seq 1 12); do
              if "$@"; then
                if [ "$attempt" -gt 1 ]; then
                  echo "$what: settled after $attempt attempts"
                fi
                return 0
              fi
              echo "$what: not ready yet (attempt $attempt)"
              sleep 5
            done
            echo "$what: still wrong after 12 attempts"
            return 1
          }

          # `//` only falls through on null, and the action leaves live_url as an
          # empty string when the app has no ingress yet, so filter by value.
          url=$(jq -er '[.live_url, .default_ingress]
                        | map(select(. != null and . != "")) | first' <<<"$APP")

          # Three things, because they fail independently: the agent process is up,
          # the API answers on the path the browser uses, and FastAPI is serving the
          # SPA rather than 404ing because the image shipped without a web build.
          serving() {
            local base=${1%/}
            curl --fail --silent --location "$base/health" | grep -q '"ok"' || return 1
            curl --fail --silent --location "$base/api/health" | grep -q '"ok"' || return 1
            curl --fail --silent --location "$base" | grep -q '<div id="root">'
          }

          echo "Checking $url"
          retry "$url" serving "$url"
          echo "Deployed and serving from $url" >> "$GITHUB_STEP_SUMMARY"
